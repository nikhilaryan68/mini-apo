<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Verification Node</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Cyberpunk Base Theme */
        body { 
            margin: 0; 
            background-color: #030106; 
            color: #0ff; 
            font-family: 'Courier New', Courier, monospace; 
            height: 100vh; 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* 1. Background Binary Rain */
        canvas { 
            display: block; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }

        /* 2. Floating Cybertech Devices (High Visibility & Glow) */
        .tech-bg { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            z-index: 2; 
            pointer-events: none; 
        }
        .icon { 
            position: absolute; 
            font-size: 3.5rem; 
            opacity: 0.9; 
            filter: drop-shadow(0 0 12px #0ff) drop-shadow(0 0 25px #f0f); 
            animation: floatUp 8s infinite linear; 
        }
        @keyframes floatUp { 
            0% { transform: translateY(115vh) rotate(0deg); } 
            100% { transform: translateY(-25vh) rotate(360deg); } 
        }

        /* 3. Perfectly Centered Cyber Container Box */
        .center-container { 
            position: relative; 
            z-index: 10; 
            text-align: center; 
            background: rgba(10, 4, 22, 0.92); /* Opaque background hides code inside the box */
            padding: 35px 25px; 
            border: 2px solid #0ff; 
            border-radius: 16px; 
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.6), inset 0 0 20px rgba(255, 0, 255, 0.4); 
            backdrop-filter: blur(10px); 
            width: 82%; 
            max-width: 330px; 
        }

        /* Glowing Dual-Color Loader Animation */
        .loader { 
            width: 85px; 
            height: 85px; 
            border: 4px solid rgba(0, 255, 255, 0.1); 
            border-top: 4px solid #0ff; 
            border-bottom: 4px solid #f0f; 
            border-radius: 50%; 
            animation: spin 1.1s linear infinite; 
            margin: 0 auto 25px; 
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.7); 
            font-family: sans-serif;
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        /* Static UI Result Transformations */
        .success { border-color: #0f0; box-shadow: 0 0 30px #0f0; animation: none; display: flex; justify-content: center; align-items: center; color: #0f0; font-size: 44px; font-weight: bold; }
        .already { border-color: #0ff; box-shadow: 0 0 30px #0ff; animation: none; display: flex; justify-content: center; align-items: center; color: #0ff; font-size: 44px; font-weight: bold; }
        .error { border-color: #f00; box-shadow: 0 0 30px #f00; animation: none; display: flex; justify-content: center; align-items: center; color: #f00; font-size: 44px; font-weight: bold; }
        
        h2 { margin: 0 0 12px; font-size: 1.35rem; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 12px #0ff; }
        p { margin: 0; font-size: 0.95rem; color: #fff; text-shadow: 0 0 8px #f0f; line-height: 1.4; }
        
        /* Debug Console Text */
        #debug-log { margin-top: 20px; font-size: 0.75rem; color: #ffeb3b; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="tech-bg">
        <div class="icon" style="left:10%; animation-delay: 0s;">💻</div>
        <div class="icon" style="left:70%; animation-delay: 2s;">📱</div>
        <div class="icon" style="left:45%; animation-delay: 4.5s;">🖥️</div>
        <div class="icon" style="left:80%; animation-delay: 6s;">📱</div>
    </div>

    <div class="center-container">
        <div id="loader" class="loader"></div>
        <h2 id="status-title">Securing Link</h2>
        <p id="status-desc">Analyzing hardware footprint...</p>
        <div id="debug-log">INITIALIZING...</div>
    </div>

    <script>
        // 1. Cyberpunk Binary Coding Matrix Rain Effect
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight;
        
        const codeMatrix = '01011001011011001';
        const fontSize = 15;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        
        function runMatrixRain() {
            ctx.fillStyle = 'rgba(3, 1, 6, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < drops.length; i++) {
                const text = codeMatrix[Math.floor(Math.random() * codeMatrix.length)];
                // Distinct glowing cyberpunk color paths
                ctx.fillStyle = Math.random() > 0.85 ? '#f0f' : '#0ff';
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(runMatrixRain, 40);

        // Resize window fix
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // 2. Hardware Verification Workflow
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const debugLog = document.getElementById('debug-log');
        const loader = document.getElementById('loader');
        const title = document.getElementById('status-title');
        const desc = document.getElementById('status-desc');

        async function performVerification() {
            try {
                let deviceToken = localStorage.getItem('device_token');
                if (!deviceToken) {
                    deviceToken = crypto.randomUUID();
                    localStorage.setItem('device_token', deviceToken);
                }

                const userId = tg.initDataUnsafe?.user?.id || 'UnknownNode';
                debugLog.innerText = "PINGING SERVER ROUTE...";

                const response = await fetch('/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: userId,
                        device_token: deviceToken,
                        init_data: tg.initData
                    })
                });

                debugLog.innerText = "PARSING DATA PACKETS...";
                
                if (!response.ok) {
                    throw new Error(`CRITICAL RESPONSE FAULT: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.status === 'success') {
                    // Unique Device Setup Complete
                    loader.className = "loader success";
                    loader.innerHTML = "✓";
                    title.innerText = "ACCESS GRANTED";
                    title.style.color = "#0f0";
                    desc.innerText = "Device fingerprint registered.";
                    debugLog.innerText = "SUCCESS: NEW NODE LINKED";
                } 
                else if (data.status === 'already_verified') {
                    // Safe Repeated Login Entry
                    loader.className = "loader already";
                    loader.innerHTML = "✓";
                    title.innerText = "ALREADY VERIFIED";
                    title.style.color = "#0ff";
                    desc.innerText = data.message;
                    debugLog.innerText = "SUCCESS: ACTIVE SESSION RESUMED";
                } 
                else {
                    // Access Violation Intercepted
                    loader.className = "loader error";
                    loader.innerHTML = "✗";
                    title.innerText = "ACCESS DENIED";
                    title.style.color = "#f00";
                    desc.innerText = data.reason || "Security policy violation.";
                    debugLog.innerText = "TERMINATED: CLONE ACCOUNT DETECTED";
                    setTimeout(() => tg.close(), 4500);
                }

            } catch (error) {
                // Connection/Server Runtime Protection Block
                loader.className = "loader error";
                loader.innerHTML = "!";
                title.innerText = "LINK DISRUPTED";
                title.style.color = "#f00";
                desc.innerText = "Core node unreachable.";
                debugLog.innerText = `${error.message}`;
            }
        }

        // Slight buffer duration to visually track startup sequence steps
        setTimeout(performVerification, 1200);
    </script>
</body>
</html>

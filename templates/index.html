<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Money Upi Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Base Theme */
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0;
            background-color: #0b0c10; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh; 
            display: flex; flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 1. Cyberpunk Matrix Rain Background */
        canvas { 
            position: absolute; top: 0; left: 0; 
            z-index: 0; opacity: 0.3; pointer-events: none;
        }

        /* 2. Top Profile Bar */
        .top-bar {
            position: relative; z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px;
            background: linear-gradient(180deg, rgba(15,17,26,0.9) 0%, rgba(15,17,26,0) 100%);
            width: 100%;
        }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar {
            width: 45px; height: 45px; border-radius: 50%;
            background: #1f2233; display: flex; justify-content: center; align-items: center;
            border: 2px solid rgba(139, 92, 246, 0.4);
            overflow: hidden;
        }
        .avatar svg { width: 24px; height: 24px; fill: #8b5cf6; }
        .details { display: flex; flex-direction: column; }
        .name { font-size: 16px; font-weight: 700; color: #ffffff; letter-spacing: 0.5px; }
        .id { font-size: 12px; color: #8fa0b5; margin-top: 2px; }
        
        .status-badge {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 12px; border-radius: 20px;
            font-size: 11px; font-weight: 700; letter-spacing: 1px;
            background: rgba(139, 92, 246, 0.15); color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }
        .status-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: #a78bfa; box-shadow: 0 0 8px #a78bfa; animation: pulse 1.5s infinite; }
        
        /* Status Badge Colors */
        .badge-active { background: rgba(16, 185, 129, 0.15); color: #34d399; border-color: rgba(16, 185, 129, 0.3); }
        .badge-active .dot { background: #34d399; box-shadow: 0 0 8px #34d399; animation: none; }
        .badge-error { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.3); }
        .badge-error .dot { background: #f87171; box-shadow: 0 0 8px #f87171; animation: none; }

        /* 3. Main Center Card */
        .main-content {
            flex: 1; display: flex; justify-content: center; align-items: center;
            position: relative; z-index: 10; padding: 0 20px;
        }
        .card {
            background: #141722;
            border-radius: 24px; width: 100%; max-width: 340px;
            padding: 40px 20px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.03);
            display: flex; flex-direction: column; align-items: center;
        }

        /* 4. Graphic / Loader Container */
        .graphic-container { width: 100px; height: 100px; margin-bottom: 25px; position: relative; display: flex; justify-content: center; align-items: center; }
        
        /* The High-Tech Circular Loader */
        .tech-loader { position: absolute; width: 100%; height: 100%; }
        .tech-loader::before, .tech-loader::after { content: ''; position: absolute; border-radius: 50%; }
        .tech-loader::before {
            top: 0; left: 0; width: 100%; height: 100%;
            border: 3px solid transparent; border-top-color: #8b5cf6; border-left-color: #8b5cf6;
            animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }
        .tech-loader::after {
            top: 15%; left: 15%; width: 70%; height: 70%;
            border: 3px solid transparent; border-bottom-color: #10b981; border-right-color: #10b981;
            animation: spin 2s linear infinite reverse;
        }
        .loader-dot {
            position: absolute; top: 18%; left: 18%; width: 8px; height: 8px;
            background: #8b5cf6; border-radius: 50%; box-shadow: 0 0 10px #8b5cf6;
            animation: orbit 1.5s linear infinite;
        }

        /* SVG Icons for Results */
        .result-icon { display: none; width: 100%; height: 100%; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 3px solid transparent; }
        .result-icon svg { width: 45px; height: 45px; }
        
        .icon-success { border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.1); box-shadow: 0 0 30px rgba(16, 185, 129, 0.2); }
        .icon-success svg { stroke: #10b981; }
        
        .icon-already { border-color: rgba(59, 130, 246, 0.4); background: rgba(59, 130, 246, 0.1); box-shadow: 0 0 30px rgba(59, 130, 246, 0.2); }
        .icon-already svg { stroke: #3b82f6; fill: rgba(59, 130, 246, 0.2); }
        
        .icon-error { border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.1); box-shadow: 0 0 30px rgba(239, 68, 68, 0.2); }
        .icon-error svg { stroke: #ef4444; }

        /* Typography */
        h2 { margin: 0 0 10px; font-size: 22px; font-weight: 700; color: #a78bfa; letter-spacing: 0.5px; }
        p { margin: 0 0 25px; font-size: 14px; color: #8fa0b5; line-height: 1.5; padding: 0 10px; }

        /* Color classes for text */
        .text-success { color: #10b981; }
        .text-already { color: #3b82f6; }
        .text-error { color: #ef4444; }

        /* 5. Progress Bar (For Loading State) */
        .progress-track { width: 100%; height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #8b5cf6, #3b82f6); border-radius: 10px; animation: progress 2s ease-in-out infinite; }

        /* 6. Action Button (For Success States) */
        .action-btn {
            display: none; width: 100%; padding: 16px; border-radius: 12px;
            border: none; font-size: 15px; font-weight: 700; color: #fff;
            letter-spacing: 0.5px; cursor: pointer; transition: 0.2s;
            margin-top: 10px;
        }
        .btn-success { background: #10b981; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2); }
        .btn-already { background: #3b82f6; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.2); }

        /* 7. Footer */
        .footer {
            position: relative; z-index: 10; text-align: center; padding: 20px;
            font-size: 12px; color: #4b5563; font-weight: 500;
        }

        /* Animations */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes orbit { 0% { transform: rotate(0deg) translateX(40px) rotate(0deg); } 100% { transform: rotate(360deg) translateX(40px) rotate(-360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        @keyframes progress { 0% { width: 0%; transform: translateX(-100%); } 50% { width: 100%; transform: translateX(0%); } 100% { width: 100%; transform: translateX(100%); } }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="top-bar">
        <div class="user-info">
            <div class="avatar">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div class="details">
                <div class="name">OWNER SAHAB 👑</div>
                <div class="id" id="display-id">ID: Fetching...</div>
            </div>
        </div>
        <div class="status-badge" id="status-badge">
            <span class="dot"></span> <span id="badge-text">SCANNING</span>
        </div>
    </div>

    <div class="main-content">
        <div class="card">
            
            <div class="graphic-container" id="graphic-box">
                <div class="tech-loader" id="loader-ring"></div>
                <div class="loader-dot" id="loader-dot"></div>
                
                <div class="result-icon icon-success" id="icon-success" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                </div>
                
                <div class="result-icon icon-already" id="icon-already" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </div>

                <div class="result-icon icon-error" id="icon-error" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </div>
            </div>

            <h2 id="card-title">Device Verification</h2>
            <p id="card-desc">Verifying device authenticity...</p>

            <div class="progress-track" id="progress-bar">
                <div class="progress-fill"></div>
            </div>

            <button class="action-btn" id="continue-btn" onclick="tg.close()">CONTINUE TO BOT</button>
        </div>
    </div>

    <div class="footer">
        © 2026 OWNER SAHAB | Designed By OWNER SAHAB
    </div>

    <script>
        // 1. Matrix Background Logic
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        
        // Using Cyberpunk binary and hex characters
        const chars = '0189ABCDEF'; 
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        
        function drawMatrix() {
            ctx.fillStyle = 'rgba(11, 12, 16, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                // Glowy Cyan and Deep Purple
                ctx.fillStyle = Math.random() > 0.5 ? '#0ff' : '#8b5cf6';
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // 2. Telegram WebApp Logic
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Grab UI Elements
        const displayId = document.getElementById('display-id');
        const badge = document.getElementById('status-badge');
        const badgeText = document.getElementById('badge-text');
        const cardTitle = document.getElementById('card-title');
        const cardDesc = document.getElementById('card-desc');
        const progressBar = document.getElementById('progress-bar');
        const continueBtn = document.getElementById('continue-btn');
        
        const loaderRing = document.getElementById('loader-ring');
        const loaderDot = document.getElementById('loader-dot');
        const iconSuccess = document.getElementById('icon-success');
        const iconAlready = document.getElementById('icon-already');
        const iconError = document.getElementById('icon-error');

        async function verifyDevice() {
            try {
                // Set User ID visually
                const userId = tg.initDataUnsafe?.user?.id || 'Unknown';
                displayId.innerText = `ID: ${userId}`;

                // Get Device Token
                let deviceToken = localStorage.getItem('device_token');
                if (!deviceToken) {
                    deviceToken = crypto.randomUUID();
                    localStorage.setItem('device_token', deviceToken);
                }

                // Call Backend
                const response = await fetch('/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: userId,
                        device_token: deviceToken,
                        init_data: tg.initData
                    })
                });

                if (!response.ok) throw new Error("Server Error");

                const data = await response.json();
                
                // Hide loading animations
                loaderRing.style.display = 'none';
                loaderDot.style.display = 'none';
                progressBar.style.display = 'none';

                if (data.status === 'success') {
                    // NEW VERIFICATION (Green UI)
                    iconSuccess.style.display = 'flex';
                    cardTitle.innerText = "Verification Complete";
                    cardTitle.className = "text-success";
                    cardDesc.innerText = "Your device has been successfully verified and secured.";
                    
                    badge.className = "status-badge badge-active";
                    badgeText.innerText = "ACTIVE";
                    
                    continueBtn.style.display = 'block';
                    continueBtn.className = "action-btn btn-success";
                } 
                else if (data.status === 'already_verified') {
                    // RETURNING USER (Blue UI)
                    iconAlready.style.display = 'flex';
                    cardTitle.innerText = "Already Verified";
                    cardTitle.className = "text-already";
                    cardDesc.innerText = "This device has already been authorized for use.";
                    
                    badge.className = "status-badge badge-active";
                    badgeText.innerText = "ACTIVE";
                    
                    continueBtn.style.display = 'block';
                    continueBtn.className = "action-btn btn-already";
                } 
                else {
                    // BLOCKED (Red UI)
                    iconError.style.display = 'flex';
                    cardTitle.innerText = "Access Denied";
                    cardTitle.className = "text-error";
                    cardDesc.innerText = data.reason || "This device cannot be used with this account.";
                    
                    badge.className = "status-badge badge-error";
                    badgeText.innerText = "ERROR";
                    
                    setTimeout(() => tg.close(), 5000);
                }

            } catch (error) {
                // SERVER FAILURE (Red UI)
                loaderRing.style.display = 'none';
                loaderDot.style.display = 'none';
                progressBar.style.display = 'none';
                
                iconError.style.display = 'flex';
                cardTitle.innerText = "Connection Failed";
                cardTitle.className = "text-error";
                cardDesc.innerText = "Could not reach verification servers. Please try again.";
                
                badge.className = "status-badge badge-error";
                badgeText.innerText = "OFFLINE";
            }
        }

        // Start process after brief delay to show animation
        setTimeout(verifyDevice, 1500);
    </script>
</body>
</html>

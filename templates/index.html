<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { margin: 0; background: #050505; color: #0ff; font-family: 'Courier New', monospace; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; }
        
        /* Neon Floating Icons Background */
        .tech-bg { position: absolute; width: 100%; height: 100%; z-index: 0; overflow: hidden; }
        .icon { position: absolute; opacity: 0.1; animation: float 10s infinite linear; }
        @keyframes float { 0% { transform: translateY(100vh); } 100% { transform: translateY(-100px); } }

        /* Spinner */
        .loader { width: 100px; height: 100px; border: 4px solid #111; border-top: 4px solid #0ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .success { border-color: #f0f; } /* Neon Pink for Success */
    </style>
</head>
<body>
    <div class="tech-bg">
        <div class="icon" style="left:10%; font-size:50px;">💻</div>
        <div class="icon" style="left:50%; font-size:40px; animation-delay: 2s;">📱</div>
        <div class="icon" style="left:80%; font-size:60px; animation-delay: 4s;">🖥️</div>
    </div>

    <div style="z-index:1; text-align:center;">
        <div id="loader" class="loader"></div>
        <h2 id="status">Authenticating...</h2>
        <p id="desc">Accessing secure node...</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function verify() {
            try {
                // Fetch logic with a timeout
                const response = await fetch('/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: tg.initDataUnsafe?.user?.id, device_token: localStorage.getItem('device_token') || crypto.randomUUID() })
                });
                
                const data = await response.json();
                
                if(data.status === 'success') {
                    document.getElementById('loader').className = "loader success";
                    document.getElementById('status').innerText = "DEVICE VERIFIED";
                    document.getElementById('desc').innerText = "CYBER-LINK ESTABLISHED";
                } else {
                    document.getElementById('status').innerText = "ACCESS DENIED";
                }
            } catch (e) {
                document.getElementById('desc').innerText = "Server Error: Retrying...";
                setTimeout(verify, 2000); // Retry if it gets stuck
            }
        }
        verify();
    </script>
</body>
</html>

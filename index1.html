<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Payment Status</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
            overflow: hidden;
        }

        /* Top Left Profile Section */
        .profile-header {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.4);
            padding: 10px 16px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .profile-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .profile-uid {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            font-family: monospace;
        }

        /* Center Card */
        .main-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 35px 25px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Status Circle */
        .status-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 6px solid #f59e0b;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px auto;
            font-size: 40px;
            background: #fff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            transition: all 0.4s ease;
        }

        /* Details Section */
        .details-container {
            text-align: left;
            background: #f8fafc;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }
        .detail-row {
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }
        .detail-row:last-child {
            margin-bottom: 0;
        }
        .label {
            font-size: 0.85rem;
            font-weight: 800;
            color: #64748b;
            width: 85px;
            flex-shrink: 0;
        }
        .value {
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
            word-break: break-all;
        }

        /* Status Specific Colors */
        .color-pending { color: #f59e0b; }
        .color-success { color: #10b981; }
        .color-failed { color: #ef4444; }
    </style>
</head>
<body>

    <div class="profile-header">
        <div id="userName" class="profile-name">LOADING...</div>
        <div id="userId" class="profile-uid">ID: ...</div>
    </div>

    <div class="main-card">
        
        <div class="status-circle" id="statusCircle">
            <i class="fas fa-hourglass-half color-pending" id="statusIcon"></i>
        </div>

        <div class="details-container">
            <div class="detail-row">
                <span class="label">STATUS :-</span>
                <span class="value color-pending" id="statusText">FETCHING...</span>
            </div>
            <div class="detail-row">
                <span class="label">AMOUNT :-</span>
                <span class="value" id="amtText">...</span>
            </div>
            <div class="detail-row">
                <span class="label">UPI ID :-</span>
                <span class="value" id="upiText">...</span>
            </div>
            <div class="detail-row">
                <span class="label">UTR :-</span>
                <span class="value" id="utrText">FETCHING...</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (window.Telegram && window.Telegram.WebApp) {
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
            }

            // Extract parameters
            const urlParams = new URLSearchParams(window.location.search);
            const uid = urlParams.get('uid') || 'N/A';
            const name = urlParams.get('name') || 'User';
            const amt = urlParams.get('amt') || '0';
            const upi = urlParams.get('upi') || 'N/A';
            const txnid = (urlParams.get('txnid') || '').trim();
            const apiTemplate = urlParams.get('api') || '';

            // Apply static content
            document.getElementById('userName').innerText = name;
            document.getElementById('userId').innerText = 'ID: ' + uid;
            document.getElementById('amtText').innerText = '₹' + amt;
            document.getElementById('upiText').innerText = upi;

            const statusCircle = document.getElementById('statusCircle');
            const statusIcon = document.getElementById('statusIcon');
            const statusText = document.getElementById('statusText');
            const utrText = document.getElementById('utrText');

            // Set up status helpers
            function isStatusKeyword(str) {
                const keywords = ['SUCCESS', 'PAID', 'FAILED', 'FAIL', 'PENDING', 'ERROR', 'REJECTED', 'TRUE', 'FALSE', 'OK', 'SUCCESSFUL'];
                return keywords.includes(str.toUpperCase());
            }

            // Fallback checking logic based on bot parameters
            let currentStatus = 'SUCCESS'; 
            let currentUtr = txnid;

            const cleanTxn = txnid.toUpperCase();
            if (cleanTxn.includes('FAIL') || cleanTxn.includes('REJECT') || cleanTxn.includes('ERR')) {
                currentStatus = 'FAILED';
                currentUtr = 'N/A';
            } else if (cleanTxn.includes('PENDING')) {
                currentStatus = 'PENDING';
                currentUtr = 'Processing...';
            } else if (isStatusKeyword(txnid)) {
                currentStatus = 'SUCCESS';
                currentUtr = 'Success / Check Bank';
            }

            // UI Refresh Engine
            function updatePageUI(status, utrValue) {
                const checkStatus = status.toUpperCase();
                
                // Keep generic API responses out of the UTR row
                if (!utrValue || isStatusKeyword(utrValue) || utrValue === '[object Object]' || utrValue === '{}') {
                    utrText.innerText = (checkStatus === 'SUCCESS') ? 'Success / Check Bank' : 'N/A';
                } else {
                    utrText.innerText = utrValue;
                }

                statusText.innerText = checkStatus;

                if (checkStatus.includes('SUCCESS') || checkStatus === 'PAID' || checkStatus === 'COMPLETED') {
                    statusCircle.style.borderColor = '#10b981';
                    statusIcon.className = 'fas fa-check color-success';
                    statusText.className = 'value color-success';
                    statusText.innerText = 'SUCCESS';
                } else if (checkStatus.includes('FAIL') || checkStatus.includes('ERROR') || checkStatus.includes('REJECT')) {
                    statusCircle.style.borderColor = '#ef4444';
                    statusIcon.className = 'fas fa-times color-failed';
                    statusText.className = 'value color-failed';
                    statusText.innerText = 'FAILED';
                } else {
                    statusCircle.style.borderColor = '#f59e0b';
                    statusIcon.className = 'fas fa-hourglass-half color-pending';
                    statusText.className = 'value color-pending';
                    statusText.innerText = 'PENDING';
                }
            }

            // Run initial UI layout immediately
            updatePageUI(currentStatus, currentUtr);

            // Execute dynamic background status scan if link is configured properly
            if (apiTemplate && txnid && !isStatusKeyword(txnid)) {
                const apiUrl = apiTemplate.replace('{txnid}', encodeURIComponent(txnid));
                
                fetch(apiUrl)
                    .then(response => response.text())
                    .then(data => {
                        try {
                            const json = JSON.parse(data);
                            let liveStatus = currentStatus;
                            let liveUtr = currentUtr;

                            // Deep scan JSON fields for payment status
                            const statusCheckFields = ['status', 'state', 'result', 'payment_status', 'txnamountstatus', 'code'];
                            for (let field of statusCheckFields) {
                                if (json[field]) { liveStatus = String(json[field]); break; }
                                if (json.data && json.data[field]) { liveStatus = String(json.data[field]); break; }
                                if (json.response && json.response[field]) { liveStatus = String(json.response[field]); break; }
                            }

                            // Deep scan JSON fields for reference number
                            const utrCheckFields = ['utr', 'ref_id', 'bank_ref', 'rrn', 'transaction_id', 'txnid', 'bank_reference'];
                            for (let field of utrCheckFields) {
                                if (json[field] && !isStatusKeyword(String(json[field]))) { liveUtr = String(json[field]); break; }
                                if (json.data && json.data[field] && !isStatusKeyword(String(json.data[field]))) { liveUtr = String(json.data[field]); break; }
                                if (json.response && json.response[field] && !isStatusKeyword(String(json.response[field]))) { liveUtr = String(json.response[field]); break; }
                            }

                            updatePageUI(liveStatus, liveUtr);
                        } catch(err) {
                            // Plain text handler
                            const plainText = data.toUpperCase();
                            let textStatus = currentStatus;
                            if (plainText.includes('SUCCESS') || plainText.includes('PAID')) textStatus = 'SUCCESS';
                            else if (plainText.includes('FAIL') || plainText.includes('REJECT')) textStatus = 'FAILED';
                            
                            // Extract 12-digit Indian banking UTR string if present in text
                            const rrnRegex = data.match(/\d{12}/);
                            const textUtr = rrnRegex ? rrnRegex[0] : txnid;

                            updatePageUI(textStatus, textUtr);
                        }
                    })
                    .catch(() => {
                        // Keep current status if blocked by browser CORS block
                        updatePageUI(currentStatus, currentUtr);
                    });
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Payment Status</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
            overflow: hidden;
        }

        /* Top Left Profile Section */
        .profile-header {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.4);
            padding: 10px 16px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .profile-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .profile-uid {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            font-family: monospace;
        }

        /* Center Card */
        .main-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 35px 25px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Status Circle */
        .status-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 6px solid #10b981; /* Default to success green */
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px auto;
            font-size: 40px;
            background: #fff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            transition: all 0.4s ease;
        }

        /* Details Section */
        .details-container {
            text-align: left;
            background: #f8fafc;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }
        .detail-row {
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }
        .detail-row:last-child {
            margin-bottom: 0;
        }
        .label {
            font-size: 0.85rem;
            font-weight: 800;
            color: #64748b;
            width: 85px;
            flex-shrink: 0;
        }
        .value {
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
            word-break: break-all;
        }

        /* Status Specific Colors */
        .color-pending { color: #f59e0b; }
        .color-success { color: #10b981; }
        .color-failed { color: #ef4444; }
    </style>
</head>
<body>

    <div class="profile-header">
        <div id="userName" class="profile-name">LOADING...</div>
        <div id="userId" class="profile-uid">ID: ...</div>
    </div>

    <div class="main-card">
        
        <div class="status-circle" id="statusCircle">
            <i class="fas fa-check color-success" id="statusIcon"></i>
        </div>

        <div class="details-container">
            <div class="detail-row">
                <span class="label">STATUS :-</span>
                <span class="value color-success" id="statusText">SUCCESS</span>
            </div>
            <div class="detail-row">
                <span class="label">AMOUNT :-</span>
                <span class="value" id="amtText">...</span>
            </div>
            <div class="detail-row">
                <span class="label">UPI ID :-</span>
                <span class="value" id="upiText">...</span>
            </div>
            <div class="detail-row">
                <span class="label">TXN ID :-</span>
                <span class="value" id="txnText">EXTRACTING...</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (window.Telegram && window.Telegram.WebApp) {
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
            }

            // Extract parameters passed from the Bot
            const urlParams = new URLSearchParams(window.location.search);
            const uid = urlParams.get('uid') || 'N/A';
            const name = urlParams.get('name') || 'User';
            const amt = urlParams.get('amt') || '0';
            const upi = urlParams.get('upi') || 'N/A';
            // Decode URI to fix any broken JSON formatting sent via URL
            const rawTxnid = decodeURIComponent(urlParams.get('txnid') || '').trim();
            const apiTemplate = decodeURIComponent(urlParams.get('api') || '');

            // Apply static text to the UI
            document.getElementById('userName').innerText = name;
            document.getElementById('userId').innerText = 'ID: ' + uid;
            document.getElementById('amtText').innerText = '₹' + amt;
            document.getElementById('upiText').innerText = upi;

            const statusCircle = document.getElementById('statusCircle');
            const statusIcon = document.getElementById('statusIcon');
            const statusText = document.getElementById('statusText');
            const txnText = document.getElementById('txnText');

            // 1. DEFAULT TO SUCCESS (Since the bot only shows this button on successful payout calls)
            let currentStatus = 'SUCCESS';
            let currentTxn = 'Processing / Check Bank';

            // 2. AGGRESSIVE TXN ID EXTRACTION
            // This Regex hunts for any 12 to 35 digit continuous number anywhere in the raw text/JSON
            const txnMatch = rawTxnid.match(/\d{12,35}/);
            
            if (txnMatch) {
                // Instantly grabs the exact order_id/utr (e.g., 521021025449514852481015)
                currentTxn = txnMatch[0];
            } else if (rawTxnid && !rawTxnid.includes('{')) {
                // If there's no long number, but the text is clean (no messy JSON), use it
                currentTxn = rawTxnid;
            }

            // 3. CHECK FOR EXPLICIT FAILURE
            // In case the API hit was registered but returned an explicit failure message
            const cleanText = rawTxnid.toUpperCase().replace(/\s/g, '');
            if (cleanText.includes('FAIL') || cleanText.includes('ERROR') || cleanText.includes('REJECT')) {
                currentStatus = 'FAILED';
                if (!txnMatch) currentTxn = 'N/A';
            } else if (cleanText.includes('PENDING')) {
                currentStatus = 'PENDING';
            }

            // Function to paint the UI colors and text
            function updatePageUI(status, txnId) {
                const checkStatus = status.toUpperCase().replace(/\s/g, '');
                txnText.innerText = txnId;

                if (checkStatus.includes('SUCCESS') || checkStatus.includes('PAID') || checkStatus.includes('COMPLETED')) {
                    statusCircle.style.borderColor = '#10b981';
                    statusIcon.className = 'fas fa-check color-success';
                    statusText.className = 'value color-success';
                    statusText.innerText = 'SUCCESS';
                } else if (checkStatus.includes('FAIL') || checkStatus.includes('ERROR') || checkStatus.includes('REJECT')) {
                    statusCircle.style.borderColor = '#ef4444';
                    statusIcon.className = 'fas fa-times color-failed';
                    statusText.className = 'value color-failed';
                    statusText.innerText = 'FAILED';
                } else {
                    statusCircle.style.borderColor = '#f59e0b';
                    statusIcon.className = 'fas fa-hourglass-half color-pending';
                    statusText.className = 'value color-pending';
                    statusText.innerText = 'PENDING';
                }
            }

            // Instantly load the safe extracted data
            updatePageUI(currentStatus, currentTxn);

            // 4. LIVE API BACKGROUND FETCH (Optional safety net)
            // Use the perfectly extracted TXN ID as the ID to query, instead of the messy JSON
            const queryId = txnMatch ? txnMatch[0] : rawTxnid;

            if (apiTemplate && queryId && !queryId.includes('{')) {
                const apiUrl = apiTemplate.replace('{txnid}', encodeURIComponent(queryId));
                
                fetch(apiUrl)
                    .then(res => res.json())
                    .then(json => {
                        let liveStatus = currentStatus;
                        let liveTxn = currentTxn;

                        // Target the exact Full2SMS status parameters
                        if (json.bank_status) liveStatus = String(json.bank_status);
                        else if (json.status) liveStatus = String(json.status);

                        // Target exact Full2SMS UTR/TXN parameters
                        if (json.utr && json.utr !== 'null' && json.utr !== '') liveTxn = String(json.utr);
                        else if (json.bank_reference) liveTxn = String(json.bank_reference);
                        else if (json.order_id) liveTxn = String(json.order_id);

                        updatePageUI(liveStatus, liveTxn);
                    })
                    .catch(err => {
                        // If browser blocks the API via CORS, silently fail. 
                        // The UI will perfectly keep the Regex-extracted TXN ID and SUCCESS status!
                        console.log("Live fetch blocked by browser CORS, relying on Regex extracted status.");
                    });
            }
        });
    </script>
</body>
</html>

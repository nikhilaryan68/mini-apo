<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Payment Status</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
            overflow: hidden;
        }

        /* Top Left Profile Section */
        .profile-header {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.4);
            padding: 10px 16px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .profile-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .profile-uid {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            font-family: monospace;
        }

        /* Center Card */
        .main-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 35px 25px;
            width: 92%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Status Circle */
        .status-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 6px solid #10b981; 
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px auto;
            font-size: 40px;
            background: #fff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            transition: all 0.4s ease;
        }

        /* Details Section */
        .details-container {
            text-align: left;
            background: #f8fafc;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }
        .detail-row {
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
        }
        .detail-row:last-child {
            margin-bottom: 0;
        }
        .label {
            font-size: 0.82rem;
            font-weight: 800;
            color: #64748b;
            width: 125px; /* Expanded layout to support gateway labels cleanly */
            flex-shrink: 0;
            letter-spacing: 0.3px;
        }
        .value {
            font-size: 0.95rem;
            font-weight: 700;
            color: #0f172a;
            word-break: break-all;
            line-height: 1.3;
        }

        /* Status Specific Colors */
        .color-pending { color: #f59e0b; }
        .color-success { color: #10b981; }
        .color-failed { color: #ef4444; }
    </style>
</head>
<body>

    <!-- Profile Corner -->
    <div class="profile-header">
        <div id="userName" class="profile-name">LOADING...</div>
        <div id="userId" class="profile-uid">ID: ...</div>
    </div>

    <!-- Main Content -->
    <div class="main-card">
        
        <!-- Icon Circle -->
        <div class="status-circle" id="statusCircle">
            <i class="fas fa-check color-success" id="statusIcon"></i>
        </div>

        <!-- Transaction Details -->
        <div class="details-container">
            <div class="detail-row">
                <span class="label">STATUS :-</span>
                <span class="value color-success" id="statusText">SUCCESS</span>
            </div>
            <div class="detail-row">
                <span class="label">AMOUNT :-</span>
                <span class="value" id="amtText">...</span>
            </div>
            <div class="detail-row">
                <span class="label">UPI ID :-</span>
                <span class="value" id="upiText">...</span>
            </div>
            <div class="detail-row">
                <span class="label">TXN ID :-</span>
                <span class="value" id="txnText">FETCHING...</span>
            </div>
            <div class="detail-row">
                <span class="label">GATEWAY RESP :-</span>
                <span class="value" id="gatewayText" style="color: #475569;">PROCESSING...</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (window.Telegram && window.Telegram.WebApp) {
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
            }

            // Extract parameters passed from the Bot
            const urlParams = new URLSearchParams(window.location.search);
            const uid = urlParams.get('uid') || 'N/A';
            const name = urlParams.get('name') || 'User';
            const amt = urlParams.get('amt') || '0';
            const upi = urlParams.get('upi') || 'N/A';
            const rawTxnid = decodeURIComponent(urlParams.get('txnid') || '').trim();
            const apiTemplate = decodeURIComponent(urlParams.get('api') || '');

            // Apply static text to the UI
            document.getElementById('userName').innerText = name;
            document.getElementById('userId').innerText = 'ID: ' + uid;
            document.getElementById('amtText').innerText = '₹' + amt;
            document.getElementById('upiText').innerText = upi;

            const statusCircle = document.getElementById('statusCircle');
            const statusIcon = document.getElementById('statusIcon');
            const statusText = document.getElementById('statusText');
            const txnText = document.getElementById('txnText');
            const gatewayText = document.getElementById('gatewayText');

            let currentStatus = 'SUCCESS'; 
            let currentTxn = '';
            let currentGateway = 'Processing...';

            // 1. SMART EXTRACTION (Try JSON Parse)
            if (rawTxnid.includes('{') || rawTxnid.includes('[')) {
                try {
                    const jsonStart = rawTxnid.indexOf('{');
                    const jsonEnd = rawTxnid.lastIndexOf('}') + 1;
                    const jsonString = rawTxnid.substring(jsonStart, jsonEnd);
                    const parsedData = JSON.parse(jsonString);
                    
                    if (parsedData.bank_status) currentStatus = String(parsedData.bank_status).toUpperCase();
                    else if (parsedData.status) currentStatus = String(parsedData.status).toUpperCase();
                    
                    if (parsedData.utr && parsedData.utr !== 'null' && parsedData.utr !== '') currentTxn = String(parsedData.utr);
                    else if (parsedData.order_id && parsedData.order_id !== 'null' && parsedData.order_id !== '') currentTxn = String(parsedData.order_id);
                    else if (parsedData.txnid && parsedData.txnid !== 'null' && parsedData.txnid !== '') currentTxn = String(parsedData.txnid);

                    // Scrape explicit textual response properties inside gateway JSON payloads
                    if (parsedData.message) currentGateway = String(parsedData.message);
                    else if (parsedData.msg) currentGateway = String(parsedData.msg);
                    else if (parsedData.remark) currentGateway = String(parsedData.remark);
                    else if (parsedData.response) currentGateway = String(parsedData.response);
                } catch (e) {
                    // Ignore parsing issues
                }
            }

            // 2. FALLBACK SCANNER: For transaction IDs passed cleanly or via raw responses
            if (!currentTxn || currentTxn === '') {
                const txnMatch = rawTxnid.match(/[a-zA-Z0-9]{10,35}/);
                if (txnMatch) {
                    currentTxn = txnMatch[0];
                } else if (rawTxnid && !rawTxnid.includes('{')) {
                    currentTxn = rawTxnid; 
                }
            }

            // If gateway response wasn't parsed from JSON structure, use raw parameter message directly
            if (currentGateway === 'Processing...' && rawTxnid && !rawTxnid.includes('{')) {
                currentGateway = rawTxnid;
            }

            // Global Explicit Status Overwrite based on incoming strings
            const cleanText = rawTxnid.toUpperCase().replace(/\s/g, '');
            if (cleanText.includes('FAIL') || cleanText.includes('ERROR') || cleanText.includes('REJECT') || cleanText.includes('INSUFFICIENT')) {
                currentStatus = 'FAILED';
            } else if (cleanText.includes('PENDING')) {
                currentStatus = 'PENDING';
            }

            if (!currentTxn || currentTxn === '') currentTxn = 'N/A';

            // Function to paint the UI colors and text fields
            function updatePageUI(status, txnId, gatewayMessage) {
                const checkStatus = status.toUpperCase().replace(/\s/g, '');
                txnText.innerText = txnId;
                gatewayText.innerText = gatewayMessage;

                if (checkStatus.includes('SUCCESS') || checkStatus.includes('PAID') || checkStatus.includes('COMPLETED')) {
                    statusCircle.style.borderColor = '#10b981';
                    statusIcon.className = 'fas fa-check color-success';
                    statusText.className = 'value color-success';
                    statusText.innerText = 'SUCCESS';
                } else if (checkStatus.includes('FAIL') || checkStatus.includes('ERROR') || checkStatus.includes('REJECT') || checkStatus.includes('INSUFFICIENT')) {
                    statusCircle.style.borderColor = '#ef4444';
                    statusIcon.className = 'fas fa-times color-failed';
                    statusText.className = 'value color-failed';
                    statusText.innerText = 'FAILED';
                } else {
                    statusCircle.style.borderColor = '#f59e0b';
                    statusIcon.className = 'fas fa-hourglass-half color-pending';
                    statusText.className = 'value color-pending';
                    statusText.innerText = 'PENDING';
                }
            }

            // Immediate initial load mapping
            updatePageUI(currentStatus, currentTxn, currentGateway);

            // 3. LIVE BACKGROUND FETCH VIA RE-VERIFICATION LINK
            const queryId = currentTxn !== 'N/A' ? currentTxn : rawTxnid;

            if (apiTemplate && queryId && !queryId.includes('{')) {
                const apiUrl = apiTemplate.replace('{txnid}', encodeURIComponent(queryId));
                
                fetch(apiUrl)
                    .then(res => res.json())
                    .then(json => {
                        let liveStatus = currentStatus;
                        let liveTxn = currentTxn;
                        let liveGateway = currentGateway;

                        if (json.bank_status) liveStatus = String(json.bank_status);
                        else if (json.status) liveStatus = String(json.status);

                        if (json.utr && json.utr !== 'null' && json.utr !== '') liveTxn = String(json.utr);
                        else if (json.bank_reference) liveTxn = String(json.bank_reference);
                        else if (json.order_id) liveTxn = String(json.order_id);

                        // Capture background API status response text dynamically
                        if (json.message) liveGateway = String(json.message);
                        else if (json.msg) liveGateway = String(json.msg);
                        else if (json.remark) liveGateway = String(json.remark);
                        else if (json.response) liveGateway = String(json.response);

                        updatePageUI(liveStatus, liveTxn, liveGateway);
                    })
                    .catch(err => {
                        console.log("Live background update skipped, fallback preserved.");
                    });
            }
        });
    </script>
</body>
</html>
